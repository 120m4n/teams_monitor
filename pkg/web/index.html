<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aro LED</title>
<style>
  :root {
    --bench: #dde6ec; --ink: #13253d; --muted: #4b5e76;
    --pcb: #1c3561; --pcb-edge: #11233f; --led-body: #eef1f4; --led-off: #c4ccd5;
    --estop: #d8261d; --estop-hi: #ff6a5c; --estop-lo: #7d0f0a;
    --collar: #ffc61a; --collar-ink: #1d1a10;
    --tape: #2350a8; --focus: #0b57d0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bench: #0d1724; --ink: #e4ecf6; --muted: #9db0c7;
      --pcb: #1b3260; --pcb-edge: #0a1830; --led-body: #d9dee4; --led-off: #8c96a3;
      --tape: #2d5fc2; --focus: #8ab4ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bench: #0d1724; --ink: #e4ecf6; --muted: #9db0c7;
    --pcb: #1b3260; --pcb-edge: #0a1830; --led-body: #d9dee4; --led-off: #8c96a3;
    --tape: #2d5fc2; --focus: #8ab4ff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px 32px;
    background: var(--bench); color: var(--ink);
    font: 17px/1.45 ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", Nunito, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 420px; }

  /* Dymo label stuck on the bench */
  h1 {
    display: inline-block; margin: 0 0 6px; padding: 4px 14px 5px;
    background: var(--tape); color: #fff; border-radius: 3px; transform: rotate(-2deg);
    font: 400 1.6rem/1.2 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .06em;
    text-shadow: 0 1px 0 rgba(255,255,255,.35), 0 -1px 0 rgba(0,0,0,.35);
    box-shadow: 0 2px 0 rgba(0,0,0,.18);
  }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }

  /* The ring: annular PCB, 12 LEDs on it, e-stop in the middle */
  .ring {
    --size: min(calc(100vw - 32px), 380px);
    --R: calc(var(--size) * .40); --ls: calc(var(--size) * .085);
    position: relative; width: var(--size); height: var(--size); margin: 18px auto 10px;
  }
  .pcb {
    position: absolute; inset: 3%; border-radius: 50%;
    border: calc(var(--size) * .14) solid var(--pcb);
    box-shadow: 0 0 0 2px var(--pcb-edge), inset 0 0 0 2px var(--pcb-edge), 0 10px 24px rgba(0,0,0,.25);
    transition: filter .4s;
  }
  .led {
    position: absolute; left: 50%; top: 50%; width: var(--ls); height: var(--ls); margin: calc(var(--ls) / -2);
    border-radius: 18%; background: var(--led-body); box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
    transform: rotate(calc(var(--i) * 30deg)) translateY(calc(-1 * var(--R)));
    transition: transform .7s cubic-bezier(.5, 1.6, .4, 1);
  }
  .led::after {
    content: ""; position: absolute; inset: 16%; border-radius: 50%;
    background: color-mix(in srgb, var(--c, #f00) calc(var(--b, 0) * 100%), var(--led-off));
    box-shadow: 0 0 calc(var(--b, 0) * var(--ls) * .9) calc(var(--b, 0) * var(--ls) * .25)
      color-mix(in srgb, var(--c, #f00) calc(var(--b, 0) * 85%), transparent);
  }
  /* Queue full: the LEDs slide off the ring into a pile at the bottom */
  [data-mode="full"] .led {
    transform: translate(calc(var(--jx) * var(--ls)), calc(var(--R) * 1.05 - var(--jy) * var(--ls)));
  }
  [data-mode="offline"] .pcb { filter: grayscale(1) brightness(.8); }

  .core { position: absolute; inset: 0; display: grid; place-items: center; }
  .core > * { grid-area: 1 / 1; }
  .collar { width: calc(var(--size) * .62); height: auto; }
  .collar text { font: 700 14px Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .08em; fill: var(--collar-ink); }
  [data-mode="disco"] .collar { animation: spin 1.2s linear infinite; }
  [data-mode="offline"] .collar { filter: grayscale(1); }

  #go {
    width: calc(var(--size) * .42); aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: radial-gradient(circle at 36% 30%, var(--estop-hi), var(--estop) 42%, var(--estop-lo) 100%);
    box-shadow: 0 calc(var(--size) * .022) 0 var(--estop-lo), 0 calc(var(--size) * .03) 14px rgba(0,0,0,.4),
      inset 0 -6px 12px rgba(0,0,0,.25);
    color: #fff; font: 400 calc(var(--size) * .09) / 1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    letter-spacing: .04em; text-shadow: 0 2px 0 rgba(0,0,0,.35);
    transition: filter .3s, translate .08s, box-shadow .08s;
  }
  #go:focus-visible { outline: 4px solid var(--focus); outline-offset: 6px; }
  #go[data-mode="idle"]:active { translate: 0 calc(var(--size) * .018); box-shadow: 0 calc(var(--size) * .004) 0 var(--estop-lo), inset 0 -4px 10px rgba(0,0,0,.3); }
  #go[aria-disabled="true"] { cursor: not-allowed; filter: saturate(.7) brightness(.85); }
  #go[data-mode="offline"] { filter: grayscale(1) brightness(.7); }
  #go[data-mode="idle"] { animation: wobble 5s ease-in-out 1s infinite; }
  #go[data-mode="soon"] { animation: tremble .1s linear 14; }
  #go.shake { animation: shake .45s; }

  .zzz, .burst { pointer-events: none; opacity: 0; }
  .zzz { position: absolute; right: 18%; top: 14%; font: 700 1.6rem/1 ui-rounded, system-ui, sans-serif; color: var(--muted); }
  [data-mode="offline"] .zzz { opacity: 1; animation: float 2.4s ease-in-out infinite; }
  .burst {
    font: 400 calc(var(--size) * .26) / 1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; color: #fff;
    -webkit-text-stroke: 3px var(--estop-lo); paint-order: stroke; text-shadow: 0 6px 0 var(--estop-lo);
  }
  [data-mode="disco"] .burst { animation: burst 1.1s cubic-bezier(.2, 1.6, .4, 1) both; }

  #tag { min-height: 1.5em; margin: 4px 0 0; font-weight: 700; color: var(--muted); }
  #msg { min-height: 3em; margin: 4px 0 0; font-weight: 700; }
  #queue { margin: 0; font-size: 1.8rem; letter-spacing: .15em; min-height: 0; }
  #queue .you { display: inline-block; padding: 0 4px; border-radius: 8px; outline: 3px solid var(--collar); animation: hop .6s ease-in-out infinite alternate; }

  .btn {
    font: inherit; font-weight: 700; color: var(--ink); background: transparent; cursor: pointer;
    border: 2px solid currentColor; border-radius: 999px; padding: 8px 18px; min-height: 44px;
  }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  #retry { margin-top: 8px; }
  footer { margin-top: auto; padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; color: var(--muted); font-size: .9rem; }
  footer .btn { color: var(--muted); padding: 4px 14px; min-height: 36px; }
  footer .btn[aria-pressed="true"] { color: var(--ink); }

  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #confetti i {
    position: absolute; top: -14px; left: var(--x); width: 8px; height: 13px; border-radius: 2px;
    background: hsl(var(--h) 95% 58%); animation: fall var(--d) ease-in forwards;
  }

  @keyframes spin { to { rotate: 360deg; } }
  @keyframes wobble { 0%, 84%, 100% { rotate: 0deg; } 88% { rotate: -7deg; } 92% { rotate: 6deg; } 96% { rotate: -3deg; } }
  @keyframes tremble { 0% { translate: -3px 0; } 50% { translate: 3px 1px; } 100% { translate: -2px -1px; } }
  @keyframes shake { 0%, 100% { translate: 0; } 20%, 60% { translate: -9px 0; } 40%, 80% { translate: 9px 0; } }
  @keyframes float { 0%, 100% { translate: 0 0; opacity: .5; } 50% { translate: 6px -10px; opacity: 1; } }
  @keyframes burst { 0% { opacity: 0; scale: .2; rotate: -20deg; } 25% { opacity: 1; scale: 1.15; rotate: 6deg; } 80% { opacity: 1; scale: 1; rotate: -4deg; } 100% { opacity: 0; scale: 1.4; } }
  @keyframes hop { to { translate: 0 -6px; } }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    [data-mode="disco"] .burst, [data-mode="offline"] .zzz { opacity: 1; }
  }
</style>

<main>
  <h1>El aro de <span class="v">Germán</span></h1>
  <p class="sub">Este botón enciende de verdad el aro LED de su escritorio.</p>

  <div class="ring" id="ring" data-mode="idle">
    <div class="pcb"></div>
    <div id="leds" aria-hidden="true"></div>
    <div class="core">
      <svg class="collar" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="84" fill="none" stroke-width="26" style="stroke: var(--collar)"/>
        <path id="arc" d="M100,16 a84,84 0 1,1 0,168 a84,84 0 1,1 0,-168" fill="none"/>
        <text dominant-baseline="central"><textPath href="#arc" textLength="520">NO PULSAR ✱ NO PULSAR ✱ NO PULSAR ✱</textPath></text>
      </svg>
      <button id="go" data-mode="idle" aria-label="Enviar un ping al aro"><span id="face" aria-hidden="true">PING</span></button>
      <span class="burst" aria-hidden="true">PING!</span>
    </div>
    <span class="zzz" aria-hidden="true">Z z z</span>
  </div>

  <p id="tag"></p>
  <p id="queue" aria-hidden="true" hidden></p>
  <p id="msg" role="status" aria-live="polite"></p>
  <button id="retry" class="btn" hidden>Reintentar</button>
</main>

<footer>
  <span id="count"></span>
  <button id="mute" class="btn" aria-pressed="false">🔇 Sonido</button>
</footer>
<div id="confetti" aria-hidden="true"></div>

<script>
'use strict';
const VICTIM = 'Germán';  // whose ring this is: change to your name
const PLAY_MS = 5000;     // how long the real ring plays one ping (cmd/app/main.go)

const $ = id => document.getElementById(id);
const ring = $('ring'), btn = $('go'), face = $('face'), msg = $('msg'), tag = $('tag'),
  queue = $('queue'), retry = $('retry'), mute = $('mute'), count = $('count');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const calm = () => reduced.matches;
const pick = a => a[Math.floor(Math.random() * a.length)];
document.querySelectorAll('.v').forEach(el => el.textContent = VICTIM);

// ---- Copy ----
const TAGS = [`Molesta a ${VICTIM}`, 'Sabes que quieres', 'Nadie está mirando', 'Es por el bien del equipo',
  'Un ping al día, alegría', 'Totalmente productivo', `${VICTIM} lo está deseando`, 'Pulsa con responsabilidad'];
const NOPES = ['Tranqui, que se recalienta', 'El aro está en su pausa del café', 'Paciencia, joven becario',
  'Esto no es un ascensor: pulsar más no lo acelera', 'Recursos Humanos ha tomado nota', 'Respira. Cuenta hasta tres'];

// ---- LEDs: 12 like the real WS2812 ring, index 0 at the top, clockwise ----
const leds = [];
const PILE = [5, 4, 3]; // jam pile rows, bottom up
for (let i = 0, row = 0, col = 0; i < 12; i++) {
  const d = document.createElement('i');
  d.className = 'led';
  d.style.setProperty('--i', i);
  if (col === PILE[row]) { row++; col = 0; }
  d.style.setProperty('--jx', ((col - (PILE[row] - 1) / 2) * 1.1).toFixed(2));
  d.style.setProperty('--jy', (row * .72).toFixed(2));
  col++;
  $('leds').append(d);
  leds.push(d);
}

const RED = '#ff2b22', AMBER = '#ffb000', ORANGE = '#ff7a00', GRAY = '#9aa4b2', GREEN = '#22ff88';
const wave = (t, period) => .5 - .5 * Math.cos(t / period * 2 * Math.PI);
// Fraction of LED i still lit in a countdown: the ring empties counterclockwise from LED 11.
const lit = (i, now) => {
  const n = Math.max(0, S.until - now) / S.total * 12;
  return i < Math.floor(n) ? 1 : i === Math.floor(n) ? n % 1 : 0;
};
// Each look returns [color, brightness 0-1] for LED i, t ms into the state.
const LOOKS = {
  idle: (i, t) => [RED, calm() ? .45 : .15 + .45 * wave(t, 3600)],
  sending: (i, t) => [RED, Math.max(.05, 1 - ((Math.floor(t / (calm() ? 160 : 70)) - i + 1200) % 12) * .3)],
  queued: (i, t) => [RED, i === Math.floor(t / 500) % 12 ? .85 : .12],
  disco: (i, t) => [`hsl(${(i * 30 + (calm() ? 0 : t * .45)) % 360} 100% 55%)`, calm() ? .85 : .55 + .45 * wave(t + i * 120, 420)],
  cooldown: (i, t, now) => [RED, lit(i, now) * .8],
  soon: (i, t, now) => [AMBER, lit(i, now) * (calm() || t > 1600 || Math.floor(t / 160) % 2 ? .95 : .08)],
  full: () => [ORANGE, .7],
  offline: () => [GRAY, .1],
  egg: (i, t) => [GREEN, calm() ? .8 : (Math.floor(t / 70) + i) % 3 === 0 ? 1 : .12],
};

// ---- State machine: idle → sending → queued → disco → cooldown → idle, plus soon / full / offline / egg ----
const S = { mode: 'idle', at: 0, next: null, until: 0, total: 1, pos: 1, taps: 0 };

function go(mode, text, after) {
  S.mode = mode;
  S.at = performance.now();
  S.next = after || null;   // [ms after entering, fn]
  ring.dataset.mode = btn.dataset.mode = mode;
  btn.setAttribute('aria-disabled', String(mode !== 'idle'));
  retry.hidden = mode !== 'offline';
  queue.hidden = mode !== 'queued';
  tag.hidden = mode !== 'idle';
  if (mode === 'cooldown') S.taps = 0;
  if (text !== undefined) msg.textContent = text;
}

const secsLeft = () => Math.max(0, Math.ceil((S.until - performance.now()) / 1000));
const idle = () => go('idle', '');
const cooldown = () => S.until > performance.now()
  ? go('cooldown', `Ping entregado. Puedes enviar otro en ${secsLeft()} s.`, [S.until - performance.now(), idle])
  : idle();
const offline = () => go('offline', `El PC de ${VICTIM} está dormido o apagado. Zzz…`);

function disco() {
  go('disco', `¡PING! El aro de ${VICTIM} está de fiesta.`, [PLAY_MS, cooldown]);
  confetti();
  sfx('disco');
}

async function send() {
  go('sending', 'Enviando ping…');
  sfx('press');
  let r, j;
  try {
    [r] = await Promise.all([
      fetch('ping', { method: 'POST', signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined }),
      new Promise(ok => setTimeout(ok, 600)), // let the scanner spin a little
    ]);
    j = await r.json();
  } catch {
    return offline();
  }
  const secs = j.retry || 10;
  S.total = secs * 1000;
  S.until = performance.now() + S.total;
  if (r.status === 202) {
    countPing();
    S.pos = j.position || 1; // 0 is omitted by the server: the worker already took it
    if (S.pos <= 1) return go('queued', '¡Eres el siguiente!', [900, disco]);
    const wait = (S.pos - 1) * PLAY_MS;
    go('queued', `En cola, con ${S.pos - 1} por delante. Te toca en unos ${Math.round(wait / 1000)} s.`, [wait, disco]);
  } else if (r.status === 429 && j.error === 'Cola llena') {
    go('full', `Hay atasco, vuelve en ${secs} s.`, [S.total, idle]);
  } else if (r.status === 429) {
    go('soon', `Demasiado pronto. El aro aún está temblando: vuelve en ${secs} s.`, [S.total, idle]);
    sfx('angry');
  } else {
    offline();
  }
}

function nope() {
  btn.classList.remove('shake');
  void btn.offsetWidth; // restart the animation
  btn.classList.add('shake');
  sfx('nope');
  const m = S.mode;
  msg.textContent = m === 'cooldown' ? `${pick(NOPES)}. Quedan ${secsLeft()} s.`
    : m === 'soon' || m === 'full' ? `Que no. Quedan ${secsLeft()} s.`
    : m === 'offline' ? 'Shh, está dormido. Prueba con Reintentar.'
    : 'Ya va, ya va.';
}

function egg() {
  go('egg', `Logro desbloqueado: insistencia nivel jefe 🏆. ${VICTIM} no se va a enterar (o sí).`, [2600, cooldown]);
  sfx('egg');
}

btn.addEventListener('click', () => {
  if (S.mode === 'idle') return send();
  if (S.mode === 'cooldown' && ++S.taps >= 5) return egg();
  nope();
});
btn.addEventListener('animationend', e => e.animationName === 'shake' && btn.classList.remove('shake'));
retry.addEventListener('click', send);

// ---- Render loop ----
const FACE = {
  idle: () => 'PING', sending: () => '···', disco: () => '¡YA!', offline: () => 'Zzz', egg: () => '🏆',
  queued: () => '#' + (aheadNow() + 1),
  cooldown: secsLeft, soon: secsLeft, full: secsLeft,
};
// Estimated pings still ahead of ours: the server only reports the position at press time.
const aheadNow = () => S.mode === 'queued' && S.pos > 1 && S.next
  ? Math.max(0, Math.ceil((S.at + S.next[0] - performance.now()) / PLAY_MS)) : 0;

let lastFace = '', lastQueue = -1;
function frame(now) {
  requestAnimationFrame(frame); // first, so one bad frame can't freeze the page
  const t = now - S.at, look = LOOKS[S.mode];
  for (let i = 0; i < 12; i++) {
    const [c, b] = look(i, t, now);
    leds[i].style.setProperty('--c', c);
    leds[i].style.setProperty('--b', b.toFixed(2));
  }
  const f = String(FACE[S.mode]());
  if (f !== lastFace) face.textContent = lastFace = f;
  const ahead = S.mode === 'queued' ? aheadNow() : -1;
  if (ahead !== lastQueue) {
    lastQueue = ahead;
    queue.innerHTML = '🧍'.repeat(Math.max(0, Math.min(ahead, 9))) + (ahead >= 0 ? '<span class="you">🙋</span>' : '');
  }
  if (S.next && t >= S.next[0]) { const fn = S.next[1]; S.next = null; fn(); }
}

// ---- Idle taglines ----
let tagIdx = Math.floor(Math.random() * TAGS.length);
const nextTag = () => { tag.textContent = TAGS[tagIdx++ % TAGS.length]; };
setInterval(() => S.mode === 'idle' && nextTag(), 3200);

// ---- Pings sent today (this browser only) ----
const KEY = 'pings-' + new Date().toLocaleDateString('sv'); // YYYY-MM-DD
let pings = 0;
try { pings = Number(localStorage.getItem(KEY)) || 0; } catch {}
const showCount = () => {
  count.textContent = pings === 0 ? 'Hoy aún no has enviado ningún ping'
    : pings === 1 ? 'Hoy has enviado 1 ping' : `Hoy has enviado ${pings} pings`;
};
function countPing() {
  pings++;
  try { localStorage.setItem(KEY, String(pings)); } catch {}
  showCount();
}

// ---- Sound: Web Audio boops, off until the user turns it on ----
let ac = null, soundOn = false;
function tone(freq, at, dur, type = 'square', vol = .06) {
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0);
  o.stop(t0 + dur);
}
const SFX = {
  press: () => { tone(520, 0, .09); tone(780, .07, .12); },
  disco: () => [523, 659, 784, 1047, 784, 1047].forEach((f, k) => tone(f, k * .11, .14, 'triangle', .09)),
  angry: () => { tone(140, 0, .25, 'sawtooth'); tone(110, .22, .3, 'sawtooth'); },
  nope: () => tone(200, 0, .12, 'sawtooth', .05),
  egg: () => [392, 523, 659, 784, 1047].forEach((f, k) => tone(f, k * .08, .3, 'triangle', .08)),
};
function sfx(name) {
  if (!soundOn || !ac) return;
  try { SFX[name](); } catch {}
}
mute.addEventListener('click', () => {
  soundOn = !soundOn;
  mute.setAttribute('aria-pressed', String(soundOn));
  mute.textContent = (soundOn ? '🔊' : '🔇') + ' Sonido';
  if (soundOn) {
    try { ac = ac || new AudioContext(); ac.resume(); } catch { ac = null; }
    sfx('press');
  }
});

// ---- Confetti for the disco ----
function confetti() {
  if (calm()) return;
  const box = $('confetti');
  for (let k = 0; k < 48; k++) {
    const p = document.createElement('i');
    p.style.cssText = `--x:${Math.random() * 100}%;--dx:${(Math.random() - .5) * 40}vw;--d:${1.8 + Math.random() * 1.8}s;` +
      `--h:${Math.floor(Math.random() * 360)};--r:${Math.floor(Math.random() * 900)}deg;animation-delay:${(Math.random() * .5).toFixed(2)}s`;
    box.append(p);
  }
  setTimeout(() => box.replaceChildren(), 4500);
}

nextTag();
showCount();
idle();
requestAnimationFrame(frame);
</script>
</html>
