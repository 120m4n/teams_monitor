<!doctype html>
<html lang="es" data-name="{{NAME}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aro LED · ¿Quién eres?</title>
<style>
  :root {
    --bench: #dde6ec; --ink: #13253d; --muted: #4b5e76; --tape: #2350a8; --focus: #0b57d0;
    --estop: #d8261d; --estop-lo: #7d0f0a; --collar: #ffc61a; --warn: #a3220f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bench: #0d1724; --ink: #e4ecf6; --muted: #9db0c7; --tape: #2d5fc2; --focus: #8ab4ff; --warn: #ff8a7a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bench: #0d1724; --ink: #e4ecf6; --muted: #9db0c7; --tape: #2d5fc2; --focus: #8ab4ff; --warn: #ff8a7a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    padding: 24px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--bench); color: var(--ink);
    font: 17px/1.45 ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", Nunito, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  main { width: 100%; max-width: 420px; }
  h1 {
    display: inline-block; margin: 0 0 6px; padding: 4px 14px 5px;
    background: var(--tape); color: #fff; border-radius: 3px; transform: rotate(-2deg);
    font: 400 1.6rem/1.2 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: .06em;
    text-shadow: 0 1px 0 rgba(255,255,255,.35), 0 -1px 0 rgba(0,0,0,.35);
    box-shadow: 0 2px 0 rgba(0,0,0,.18);
  }
  .sub { margin: 8px 0 24px; color: var(--muted); }
  form, #ask { display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: left; }
  [hidden] { display: none !important; }
  label { font-weight: 700; }
  input {
    font: inherit; font-size: 1.3rem; color: var(--ink); background: transparent;
    border: 2px solid var(--muted); border-radius: 12px; padding: 10px 14px; min-height: 52px; width: 100%;
  }
  input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  input[aria-invalid="true"] { border-color: var(--warn); }
  .hint { margin: 0; color: var(--muted); font-size: .9rem; }
  #err { margin: 0; min-height: 1.5em; color: var(--warn); font-weight: 700; }
  #ask { text-align: center; }
  #ask p { margin: 0; }
  #preview { display: inline-block; padding: 2px 12px; border: 2px solid var(--collar); border-radius: 999px; font-weight: 700; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 10px 22px; min-height: 48px;
    color: var(--ink); background: transparent; border: 2px solid currentColor;
  }
  .btn.main { color: #fff; background: var(--estop); border-color: var(--estop-lo); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>

<main>
  <h1>El aro de <span class="v"></span></h1>
  <p class="sub">Antes de pulsar, dinos quién eres: tu nick sale en la cola de pings.</p>

  <form id="form" novalidate>
    <label for="nick">Tu nick</label>
    <input id="nick" name="nick" maxlength="16" autocomplete="nickname" autocapitalize="off" autocorrect="off"
      spellcheck="false" aria-describedby="hint err" required>
    <p class="hint" id="hint">De 2 a 16 letras (A-Z) o números, sin espacios, tildes ni símbolos.</p>
    <p id="err" role="alert"></p>
    <button class="btn main">Continuar</button>
  </form>

  <section id="ask" hidden aria-labelledby="askq">
    <p id="askq">En la cola te verán como <span id="preview"></span></p>
    <p class="hint" id="cut" hidden>Los nicks de más de 8 caracteres se recortan en la cola.</p>
    <p class="hint">¿Usar «<b id="full"></b>»?</p>
    <div class="row">
      <button class="btn" id="edit" type="button">Cambiar</button>
      <button class="btn main" id="yes" type="button">Sí, continuar</button>
    </div>
  </section>
</main>

<script>
'use strict';
const NICK_RE = /^[A-Za-z0-9]{2,16}$/; // same rule as nickRe in web.go
const $ = id => document.getElementById(id);
const form = $('form'), nick = $('nick'), err = $('err'), ask = $('ask');
document.querySelectorAll('.v').forEach(el => el.textContent = document.documentElement.dataset.name || 'tu compañero');

const warn = text => { err.textContent = text; nick.setAttribute('aria-invalid', String(!!text)); };

try { nick.value = (localStorage.getItem('nick') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 16); } catch {}

// Typing or pasting a space or symbol: drop it on the spot and say why.
nick.addEventListener('input', () => {
  const clean = nick.value.replace(/[^A-Za-z0-9]/g, '');
  if (clean === nick.value) return warn('');
  nick.value = clean;
  warn('Quitado: solo se admiten letras (A-Z) y números, sin espacios, tildes ni símbolos.');
});

form.addEventListener('submit', e => {
  e.preventDefault();
  const v = nick.value;
  if (!NICK_RE.test(v)) {
    warn(v.length < 2 ? 'Escribe al menos 2 caracteres.' : 'Solo letras (A-Z) y números, sin espacios ni símbolos.');
    return nick.focus();
  }
  warn('');
  $('preview').textContent = v.length > 8 ? v.slice(0, 8) + '…' : v;
  $('full').textContent = v;
  $('cut').hidden = v.length <= 8;
  form.hidden = true;
  ask.hidden = false;
  $('yes').focus();
});

$('edit').addEventListener('click', () => {
  ask.hidden = true;
  form.hidden = false;
  nick.focus();
});

$('yes').addEventListener('click', () => {
  try {
    localStorage.setItem('nick', nick.value);
    if (localStorage.getItem('nick') !== nick.value) throw 0;
  } catch {
    ask.hidden = true;
    form.hidden = false;
    return warn('Tu navegador no deja guardar el nick (¿modo privado?). Sin nick no se pueden enviar pings.');
  }
  location.replace('./');
});

if (!nick.value) nick.focus();
</script>
</html>
